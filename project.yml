name: PiCamera
options:
  bundleIdPrefix: uk.co.antoninegri
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: uk.co.antoninegri.PiCamera
    INFOPLIST_KEY_CFBundleDisplayName: Pi Camera
    INFOPLIST_KEY_NS BluetoothAlwaysUsageDescription: "Connect to your Raspberry Pi camera over Bluetooth."
targets:
  PiCamera:
    type: application
    platform: iOS
    sources:
      - PiCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Connect to your Raspberry Pi camera over Bluetooth."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save photographs received from your Raspberry Pi camera."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
